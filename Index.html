<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FoodieGo - Online Food Ordering</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  background: #fff8f0;
  color: #333;
}

button {
  cursor: pointer;
  border: none;
  border-radius: 8px;
  padding: 12px 22px;
  background: #ff5722;
  color: white;
  font-size: 16px;
}

button:hover {
  background: #e64a19;
}

.page {
  display: none;
  min-height: 100vh;
}

.page.active {
  display: block;
}

/* FIRST PAGE */
#welcome {
  display: none;
  align-items: center;
  justify-content: center;
  text-align: center;
  background: linear-gradient(135deg, #ff5722, #ff9800);
  color: white;
}

#welcome.active {
  display: flex;
}

.welcome-box {
  padding: 30px;
}

.food-icon {
  font-size: 75px;
  margin-bottom: 15px;
}

.welcome-box h1 {
  font-size: 55px;
  margin-bottom: 12px;
}

.welcome-box p {
  margin-bottom: 30px;
  font-size: 18px;
}

.welcome-box button {
  background: white;
  color: #ff5722;
  font-weight: bold;
  min-width: 180px;
}

/* LOGIN PAGE */
#login {
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: linear-gradient(135deg, #fff0df, #ffe0c2);
}

#login.active {
  display: flex;
}

.login-box {
  background: white;
  padding: 35px 25px;
  border-radius: 16px;
  width: 100%;
  max-width: 380px;
  text-align: center;
  box-shadow: 0 8px 25px #00000015;
}

.login-box h2 {
  color: #ff5722;
  margin-bottom: 10px;
}

.login-box p {
  margin-bottom: 22px;
  color: #666;
}

.login-box input {
  width: 100%;
  padding: 13px;
  margin-bottom: 15px;
  border: 1px solid #ddd;
  border-radius: 7px;
  font-size: 15px;
}

.login-box button {
  width: 100%;
}

.back {
  margin-top: 15px;
  background: #eee;
  color: #333;
}
